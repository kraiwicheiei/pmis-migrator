# Sync the queues with the legacy sheets without the AI: `python pmis.py sync queue db --no-ai`. The queue step builds / syncs MIGRATION_QUEUE / MIGRATION_QUEUE_DRQ from the legacy tabs
# and, right after, part 1 of the db step (input db) fixes DB_DWR / DB_DRQ to match them. No Gemini call, so no Gemini key. Part 2 of the db step (the AI reads the PDFs of the
# Waiting rows) is the workflow sync-db.yml; sync.yml runs the queue step and the whole db step (with the AI) in one go.
#
# The chain: legacy sheet --queue--> queue --db--> DB. Part 1 of the db step removes the DB rows that came from the legacy sheet (tag 'Synced' or 'Outdated') but whose PDF is not in the queue any more
# (copied to a _REMOVED_<tab> tab first), updates C/P and Folder Link, and sets the tag in column 'Legacy sync' ('Synced' = checked against the queue, 'Outdated' = the PDF changed and the AI has not replaced the row yet;
# a row that never came from the legacy sheet has no tag and is never removed). A Done row whose PDF changed in the legacy sheet goes back to Waiting, so the next `sync db` with the AI
# (sync-db.yml or sync.yml) reads the new file and replaces the old DB row in place.
#
# Required repository secret (Settings > Secrets and variables > Actions > Secrets):
#   SA_KEY_JSON                 the whole contents of the service-account key file (.json)
# GEMINI_API_KEY is not needed.
#
# Repository VARIABLES (the same page, Variables tab; plain settings, not credentials, so they are variables, not secrets).
# A secret with the same name still works as a fallback, and a variable wins over it:
#   PMIS_SPREADSHEET_ID         ID of the target spreadsheet (the queues are always written here)
#   PMIS_LEGACY_DWR_SHEET       exact name of the legacy tab the DWR queue is built from
#   PMIS_LEGACY_DRQ_SHEET       exact name of the legacy tab the DRQ queue is built from
#   PMIS_LEGACY_SPREADSHEET_ID  (optional) ID or URL of the spreadsheet file that holds the legacy tabs.
#                               Empty = the same file as PMIS_SPREADSHEET_ID. The run input legacy_spreadsheet wins over it.
#                               Share that file with the service account (Viewer is enough).
# Variables are not masked in the log, so the script never prints them (--public-log), and the legacy file's ID / URL is masked explicitly.
#
# Start with mode = dry-run (reads the legacy tabs and the DB, writes nothing), then run with mode = sync.
# Safety net: a run that would remove more rows than the limit (the larger of 10% of the rows and 100) from the queue or a DB is refused; allow_large_removal lifts it.
# A queue that already has rows is SYNCED (every row is recomputed from the legacy sheet and the status of the existing row is kept);
# overwrite rebuilds it from scratch (every row Waiting).
# The log shows counts only (--public-log); run the script locally to see the names and Doc Nos.
name: Sync queue and DB (no AI)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = read the legacy tabs and show the plan, write nothing | sync = sync the queues (and the DB rows) for real"
        type: choice
        options: [dry-run, sync]
        default: dry-run
      queue:
        description: "Which queue: both = DWR then DRQ"
        type: choice
        options: [both, dwr, drq]
        default: both
      legacy_spreadsheet:
        description: "ID or URL of the spreadsheet that holds the legacy tabs (empty = variable PMIS_LEGACY_SPREADSHEET_ID, or the target file). Inputs are visible on the run page"
        type: string
        default: ""
      overwrite:
        description: "Rebuild the queue from scratch instead of syncing (clears it: every row becomes Waiting and every Done/Error status is wiped). Normally leave this off"
        type: boolean
        default: false
      db:
        description: "Also run part 1 of the db step (no AI) after the queue step: make DB_DWR / DB_DRQ match the queue (remove the DB rows that came from the legacy sheet and whose PDF is not in the queue any more, copied to a _REMOVED_<tab> tab first; a row that never came from the legacy sheet is kept; update C/P and Folder Link; set the Legacy sync tag). Turn off to sync only the queue"
        type: boolean
        default: true
      allow_large_removal:
        description: "Allow removing more rows than the safety limit (the larger of 10% of the rows and 100). Normally leave this off"
        type: boolean
        default: false

# Same group as sync-db.yml and sync.yml: two syncs never run at the same time
concurrency:
  group: pmis-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
        with:
          extra-packages: pytest pyyaml
      - run: python -m pytest -q

  sync-queue:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps

      - name: Sync queue and DB (no AI)
        shell: bash
        env:
          # Inputs go through environment variables (never pasted into the script text)
          IN_MODE: ${{ inputs.mode || 'dry-run' }}
          IN_QUEUE: ${{ inputs.queue || 'both' }}
          IN_LEGACY_SPREADSHEET: ${{ inputs.legacy_spreadsheet || '' }}
          IN_OVERWRITE: ${{ inputs.overwrite || false }}
          IN_DB: ${{ inputs.db }}
          IN_ALLOW_LARGE_REMOVAL: ${{ inputs.allow_large_removal || false }}
          SA_KEY_JSON: ${{ secrets.SA_KEY_JSON }}
          # variable first, then the secret of the same name (the old way) as a fallback
          PMIS_SPREADSHEET_ID: ${{ vars.PMIS_SPREADSHEET_ID || secrets.PMIS_SPREADSHEET_ID }}
          # variables first, then the secret of the same name (the old way) as a fallback
          PMIS_LEGACY_DWR_SHEET: ${{ vars.PMIS_LEGACY_DWR_SHEET || secrets.PMIS_LEGACY_DWR_SHEET }}
          PMIS_LEGACY_DRQ_SHEET: ${{ vars.PMIS_LEGACY_DRQ_SHEET || secrets.PMIS_LEGACY_DRQ_SHEET }}
          PMIS_LEGACY_SPREADSHEET_ID: ${{ vars.PMIS_LEGACY_SPREADSHEET_ID || secrets.PMIS_LEGACY_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          [[ -n "$PMIS_SPREADSHEET_ID" ]] || die "Variable PMIS_SPREADSHEET_ID is missing or empty"
          # a variable is not masked by GitHub like a secret is, so mask the ID explicitly (the script never prints it anyway: --public-log)
          echo "::add-mask::$PMIS_SPREADSHEET_ID"

          # the steps: queue always; db unless the input db is explicitly false (an API call that leaves the input out gets the default, on).
          # --no-ai: this workflow never calls Gemini (the db step runs only its part 1)
          steps=(queue)
          [[ "${IN_DB:-true}" == "false" ]] || steps+=(db)
          args=(sync "${steps[@]}" --no-ai --public-log)
          case "$IN_MODE" in
            dry-run) args+=(--dry-run) ;;
            sync) ;;
            *) die "Unknown mode: $IN_MODE" ;;
          esac
          case "$IN_QUEUE" in
            both) ;;
            dwr|drq) args+=(--queue "$IN_QUEUE") ;;
            *) die "Unknown queue: $IN_QUEUE" ;;
          esac

          # The legacy tab name of each queue that is built is required
          if [[ "$IN_QUEUE" != drq && -z "$PMIS_LEGACY_DWR_SHEET" ]]; then die "Variable PMIS_LEGACY_DWR_SHEET is missing or empty (needed to build the DWR queue)"; fi
          if [[ "$IN_QUEUE" != dwr && -z "$PMIS_LEGACY_DRQ_SHEET" ]]; then die "Variable PMIS_LEGACY_DRQ_SHEET is missing or empty (needed to build the DRQ queue)"; fi
          [[ "$IN_OVERWRITE" != "true" ]] || args+=(--overwrite)
          [[ "$IN_ALLOW_LARGE_REMOVAL" != "true" ]] || args+=(--allow-large-removal)

          # The legacy file may be given as an ID or a URL; hide both forms from the log (the Running: line below prints the arguments)
          for legacy_value in "$IN_LEGACY_SPREADSHEET" "$PMIS_LEGACY_SPREADSHEET_ID"; do
            [[ -n "$legacy_value" ]] || continue
            echo "::add-mask::$legacy_value"
            legacy_id=$(printf '%s' "$legacy_value" | sed -nE 's#.*/d/([A-Za-z0-9_-]+).*#\1#p')
            if [[ -n "$legacy_id" ]]; then echo "::add-mask::$legacy_id"; fi
          done
          if [[ -n "$IN_LEGACY_SPREADSHEET" ]]; then args+=(--legacy-spreadsheet "$IN_LEGACY_SPREADSHEET"); fi

          # --public-log prints counts only. Anything the script writes to stderr (tracebacks, setup errors) goes to a file
          # that is never printed: the repository may be public, and the details can contain tab names and IDs.
          echo "Running: python pmis.py ${args[*]}"
          set +e
          bash .github/scripts/with_credentials.sh python pmis.py "${args[@]}" 2> "$RUNNER_TEMP/stderr.log" | tee >(grep -v '^::' > "$RUNNER_TEMP/counts.log")
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            echo "::error::pmis.py exited with code $status (2 = a queue could not be built, or it was left untouched because its header row is not the expected one - fix it or use overwrite, or a queue / DB was refused by the safety net: too many rows to remove - check the legacy sheet, then use allow_large_removal). Run the script locally for the full log."
          fi
          exit "$status"

      - name: Job summary
        if: always()
        shell: bash
        env:
          PMIS_SPREADSHEET_ID: ${{ vars.PMIS_SPREADSHEET_ID || secrets.PMIS_SPREADSHEET_ID }}
        run: bash .github/scripts/job_summary.sh "Sync queue run" "$RUNNER_TEMP/counts.log"
