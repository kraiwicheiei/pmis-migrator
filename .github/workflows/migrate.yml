# Run the MIGRATION_QUEUE / MIGRATION_QUEUE_DRQ migration (PDF -> Gemini -> DB) on GitHub-hosted runners.
# Building the queues from the legacy sheets is a separate workflow: extract.yml
#
# Required repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   SA_KEY_JSON          the whole contents of the service-account key file (.json)
#   GEMINI_API_KEY       Gemini API key (only needed when mode = run)
# Required repository VARIABLE (the Variables tab; a plain setting, not a credential). A secret with the same name still works
# as a fallback, and the variable wins over it:
#   PMIS_SPREADSHEET_ID  ID of the target spreadsheet
#
# Start with mode = dry-run, then check-access, then run with a small limit.
# The log shows counts only (--public-log); the details are in column G of the queue sheet.
name: Migrate queue

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = list rows only | check-access = check Drive access only | run = migrate for real"
        type: choice
        options: [dry-run, check-access, run]
        default: dry-run
      queue:
        description: "Which queue: both = DWR then DRQ"
        type: choice
        options: [both, dwr, drq]
        default: both
      limit:
        description: "Max rows per queue (0 = no limit)"
        type: string
        default: "30"
      only_rows:
        description: "Only these sheet rows, e.g. 83,102,127-128 (needs queue = dwr or drq)"
        type: string
        default: ""
      accept_first_report:
        description: "If the AI returns several reports and none matches the Doc No, use the first one"
        type: boolean
        default: false
      max_output_tokens:
        description: "Gemini maxOutputTokens, e.g. 16000 (empty = not set). Use when the cell says finishReason=MAX_TOKENS"
        type: string
        default: ""

# No `schedule:` here: runs are started from outside (cron-job.org calls the workflow_dispatch API),
# because GitHub's own cron was not starting runs for this repository.

# Never run two migrations (or a migration and an extract) at the same time: both would touch the same queue rows
concurrency:
  group: migrate-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
        with:
          extra-packages: pytest
      - run: python -m pytest -q

  migrate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps

      - name: Migrate
        shell: bash
        env:
          # Inputs go through environment variables (never pasted into the script text)
          IN_MODE: ${{ inputs.mode || 'dry-run' }}
          IN_QUEUE: ${{ inputs.queue || 'both' }}
          IN_LIMIT: ${{ inputs.limit || '30' }}
          IN_ONLY_ROWS: ${{ inputs.only_rows || '' }}
          IN_ACCEPT_FIRST: ${{ inputs.accept_first_report || false }}
          IN_MAX_TOKENS: ${{ inputs.max_output_tokens || '' }}
          SA_KEY_JSON: ${{ secrets.SA_KEY_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # variable first, then the secret of the same name (the old way) as a fallback
          PMIS_SPREADSHEET_ID: ${{ vars.PMIS_SPREADSHEET_ID || secrets.PMIS_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          [[ -n "$PMIS_SPREADSHEET_ID" ]] || die "Variable PMIS_SPREADSHEET_ID is missing or empty"
          # a variable is not masked by GitHub like a secret is, so mask the ID explicitly (the script never prints it anyway: --public-log)
          echo "::add-mask::$PMIS_SPREADSHEET_ID"

          args=(--public-log)
          case "$IN_MODE" in
            dry-run) args+=(--dry-run) ;;
            check-access) args+=(--check-access) ;;
            run) [[ -n "$GEMINI_API_KEY" ]] || die "Secret GEMINI_API_KEY is missing or empty (needed for mode = run)" ;;
            *) die "Unknown mode: $IN_MODE" ;;
          esac
          case "$IN_QUEUE" in
            both) ;;
            dwr|drq) args+=(--queue "$IN_QUEUE") ;;
            *) die "Unknown queue: $IN_QUEUE" ;;
          esac
          [[ "$IN_LIMIT" =~ ^[0-9]+$ ]] || die "limit must be a whole number"
          args+=(--limit "$IN_LIMIT")
          if [[ -n "$IN_ONLY_ROWS" ]]; then
            [[ "$IN_ONLY_ROWS" =~ ^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$ ]] || die "only_rows must look like 83,102,127-128"
            [[ "$IN_QUEUE" != both ]] || die "only_rows needs queue = dwr or drq (row numbers belong to one queue sheet)"
            args+=(--only-rows "$IN_ONLY_ROWS")
          fi
          if [[ -n "$IN_MAX_TOKENS" ]]; then
            [[ "$IN_MAX_TOKENS" =~ ^[0-9]+$ ]] || die "max_output_tokens must be a whole number"
            args+=(--max-output-tokens "$IN_MAX_TOKENS")
          fi
          if [[ "$IN_ACCEPT_FIRST" == "true" ]]; then
            args+=(--accept-first-report)
          fi

          # --public-log prints counts only. Anything the script writes to stderr (tracebacks, setup errors) goes to a file
          # that is never printed: the repository may be public, and the details can contain names and IDs.
          echo "Running: python migrate_queue.py ${args[*]}"
          set +e
          bash .github/scripts/with_credentials.sh python migrate_queue.py "${args[@]}" 2> "$RUNNER_TEMP/stderr.log" | tee >(grep -v '^::' > "$RUNNER_TEMP/counts.log")
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            echo "::error::migrate_queue.py exited with code $status (2 = stopped early or a queue could not be read). Row details are in column G of the queue sheet; run the script locally for the full log."
          fi
          exit "$status"

      - name: Job summary
        if: always()
        shell: bash
        env:
          PMIS_SPREADSHEET_ID: ${{ vars.PMIS_SPREADSHEET_ID || secrets.PMIS_SPREADSHEET_ID }}
        run: bash .github/scripts/job_summary.sh "Migration run" "$RUNNER_TEMP/counts.log"
