# Run the MIGRATION_QUEUE / MIGRATION_QUEUE_DRQ migration on GitHub-hosted runners.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   SA_KEY_JSON          the whole contents of the service-account key file (.json)
#   GEMINI_API_KEY       Gemini API key (only needed when mode = run)
#   PMIS_SPREADSHEET_ID  ID of the target spreadsheet (the queues are always written here)
#
# Only for mode = extract / extract-dry-run (build the queues from the legacy tabs):
#   PMIS_LEGACY_DWR_SHEET       exact name of the legacy tab the DWR queue is built from
#   PMIS_LEGACY_DRQ_SHEET       exact name of the legacy tab the DRQ queue is built from
#   PMIS_LEGACY_SPREADSHEET_ID  (optional) ID or URL of the spreadsheet file that holds the legacy tabs.
#                               Empty = the same file as PMIS_SPREADSHEET_ID. The run input legacy_spreadsheet wins over it.
#                               Share that file with the service account (Viewer is enough).
#
# Start with mode = dry-run, then check-access, then run with a small limit.
# To fill the queues: extract-dry-run first, then extract.
name: Migrate queue

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = list rows only | check-access = check Drive access only | run = migrate for real | extract-dry-run = read the legacy tabs, write nothing | extract = build the queues from the legacy tabs"
        type: choice
        options: [dry-run, check-access, run, extract-dry-run, extract]
        default: dry-run
      queue:
        description: "Which queue: both = DWR then DRQ"
        type: choice
        options: [both, dwr, drq]
        default: both
      limit:
        description: "Max rows per queue (0 = no limit)"
        type: string
        default: "30"
      only_rows:
        description: "Only these sheet rows, e.g. 83,102,127-128 (needs queue = dwr or drq)"
        type: string
        default: ""
      accept_first_report:
        description: "If the AI returns several reports and none matches the Doc No, use the first one"
        type: boolean
        default: false
      max_output_tokens:
        description: "Gemini maxOutputTokens, e.g. 16000 (empty = not set). Use when the cell says finishReason=MAX_TOKENS"
        type: string
        default: ""
      legacy_spreadsheet:
        description: "extract only: ID or URL of the spreadsheet that holds the legacy tabs (empty = secret PMIS_LEGACY_SPREADSHEET_ID, or the target file). Inputs are visible on the run page"
        type: string
        default: ""
      overwrite:
        description: "extract only: allow rebuilding a queue that already has Done/Error rows (wipes every status back to Waiting)"
        type: boolean
        default: false

  # No `schedule:` here: runs are started from outside (cron-job.org calls the workflow_dispatch API),
  # because GitHub's own cron was not starting runs for this repository.

# Never run two migrations at the same time (both would pick the same Waiting rows)
concurrency:
  group: migrate-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  migrate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Migrate
        shell: bash
        env:
          # Inputs go through environment variables (never pasted into the script text)
          IN_MODE: ${{ inputs.mode || 'dry-run' }}
          IN_QUEUE: ${{ inputs.queue || 'both' }}
          IN_LIMIT: ${{ inputs.limit || '30' }}
          IN_ONLY_ROWS: ${{ inputs.only_rows || '' }}
          IN_ACCEPT_FIRST: ${{ inputs.accept_first_report || false }}
          IN_MAX_TOKENS: ${{ inputs.max_output_tokens || '' }}
          IN_LEGACY_SPREADSHEET: ${{ inputs.legacy_spreadsheet || '' }}
          IN_OVERWRITE: ${{ inputs.overwrite || false }}
          SA_KEY_JSON: ${{ secrets.SA_KEY_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PMIS_SPREADSHEET_ID: ${{ secrets.PMIS_SPREADSHEET_ID }}
          PMIS_LEGACY_DWR_SHEET: ${{ secrets.PMIS_LEGACY_DWR_SHEET }}
          PMIS_LEGACY_DRQ_SHEET: ${{ secrets.PMIS_LEGACY_DRQ_SHEET }}
          PMIS_LEGACY_SPREADSHEET_ID: ${{ secrets.PMIS_LEGACY_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          [[ -n "$SA_KEY_JSON" ]] || die "Secret SA_KEY_JSON is missing or empty"
          [[ -n "$PMIS_SPREADSHEET_ID" ]] || die "Secret PMIS_SPREADSHEET_ID is missing or empty"

          extract=false
          args=()
          case "$IN_MODE" in
            dry-run) args+=(--dry-run) ;;
            check-access) args+=(--check-access) ;;
            run) [[ -n "$GEMINI_API_KEY" ]] || die "Secret GEMINI_API_KEY is missing or empty (needed for mode = run)" ;;
            extract) extract=true; args+=(--extract) ;;
            extract-dry-run) extract=true; args+=(--extract --dry-run) ;;
            *) die "Unknown mode: $IN_MODE" ;;
          esac
          case "$IN_QUEUE" in
            both) ;;
            dwr|drq) args+=(--queue "$IN_QUEUE") ;;
            *) die "Unknown queue: $IN_QUEUE" ;;
          esac

          if [[ "$extract" == true ]]; then
            # --extract has no row limit, no row filter and no Gemini call; it needs the legacy tab name of each queue it builds
            [[ -z "$IN_ONLY_ROWS" ]] || die "only_rows cannot be used with mode = extract"
            if [[ "$IN_QUEUE" != drq && -z "$PMIS_LEGACY_DWR_SHEET" ]]; then die "Secret PMIS_LEGACY_DWR_SHEET is missing or empty (needed to build the DWR queue)"; fi
            if [[ "$IN_QUEUE" != dwr && -z "$PMIS_LEGACY_DRQ_SHEET" ]]; then die "Secret PMIS_LEGACY_DRQ_SHEET is missing or empty (needed to build the DRQ queue)"; fi
            [[ "$IN_OVERWRITE" != "true" ]] || args+=(--overwrite)
            # The legacy file may be given as an ID or a URL; hide both forms from the log (the Running: line below prints the arguments)
            for legacy_value in "$IN_LEGACY_SPREADSHEET" "$PMIS_LEGACY_SPREADSHEET_ID"; do
              [[ -n "$legacy_value" ]] || continue
              echo "::add-mask::$legacy_value"
              legacy_id=$(printf '%s' "$legacy_value" | sed -nE 's#.*/d/([A-Za-z0-9_-]+).*#\1#p')
              if [[ -n "$legacy_id" ]]; then echo "::add-mask::$legacy_id"; fi
            done
            if [[ -n "$IN_LEGACY_SPREADSHEET" ]]; then args+=(--legacy-spreadsheet "$IN_LEGACY_SPREADSHEET"); fi
          else
            [[ "$IN_OVERWRITE" != "true" ]] || die "overwrite only works with mode = extract"
            [[ -z "$IN_LEGACY_SPREADSHEET" ]] || die "legacy_spreadsheet only works with mode = extract or extract-dry-run"
            [[ "$IN_LIMIT" =~ ^[0-9]+$ ]] || die "limit must be a whole number"
            args+=(--limit "$IN_LIMIT")
            if [[ -n "$IN_ONLY_ROWS" ]]; then
              [[ "$IN_ONLY_ROWS" =~ ^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$ ]] || die "only_rows must look like 83,102,127-128"
              [[ "$IN_QUEUE" != both ]] || die "only_rows needs queue = dwr or drq (row numbers belong to one queue sheet)"
              args+=(--only-rows "$IN_ONLY_ROWS")
            fi
            if [[ -n "$IN_MAX_TOKENS" ]]; then
              [[ "$IN_MAX_TOKENS" =~ ^[0-9]+$ ]] || die "max_output_tokens must be a whole number"
              args+=(--max-output-tokens "$IN_MAX_TOKENS")
            fi
            if [[ "$IN_ACCEPT_FIRST" == "true" ]]; then
              args+=(--accept-first-report)
            fi
          fi

          # The service-account key only exists as a temporary file readable by this user, and is removed at the end
          umask 077
          key_file="$RUNNER_TEMP/sa-key.json"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SA_KEY_JSON" > "$key_file"
          python -c 'import json,sys; json.load(open(sys.argv[1]))' "$key_file" 2>/dev/null || die "Secret SA_KEY_JSON is not valid JSON (paste the whole key file)"
          # Also hide the service-account e-mail and project ID, should anything print them
          for key_field in client_email project_id; do
            value=$(python -c 'import json,sys; print(json.load(open(sys.argv[1])).get(sys.argv[2]) or "")' "$key_file" "$key_field")
            if [[ -n "$value" ]]; then echo "::add-mask::$value"; fi
          done
          export GOOGLE_APPLICATION_CREDENTIALS="$key_file"

          # Actions logs are readable by anyone when the repository is public, so the full output (file IDs, sheet name,
          # row errors that quote text from the PDFs) only goes to a temporary file on the runner. The log shows the
          # counts only; the per-row details are in column G of the queue sheet.
          safe_lines='^(Queue |Rows to process|Finished:|All queues|Of the Done rows|Stopped early|Gemini calls:|✗ Could not process queue|\[MIGRATION_QUEUE(_DRQ)?\] Reachable|\(dry-run)'
          echo "Running: python migrate_queue.py ${args[*]}"
          status=0
          python migrate_queue.py "${args[@]}" > "$RUNNER_TEMP/run.log" 2>&1 || status=$?
          if [[ "$extract" == true ]]; then
            # --extract prints tab names, spreadsheet names/IDs and sample Doc Nos: keep only the counts, and cut the tab name and any error detail
            extract_safe='^(\[[A-Z]+\] Read tab |  (✓ Wrote queue|⚠ [0-9]+ items have no PDF link|⚠ skipped [0-9]+ cells|⚠ --overwrite: |No items found|✗ The [A-Z_]+ queue already has processed rows|\(--dry-run\) nothing was written)|    Nothing was written|✗ Could not build queue )'
            grep -E "$extract_safe" "$RUNNER_TEMP/run.log" \
              | sed -E "s/Read tab '.*': /Read legacy tab: /; s/^(✗ Could not build queue [A-Z_]+).*/\1 - run the script locally for the reason/" \
              > "$RUNNER_TEMP/counts.log" || true
          else
            grep -E "$safe_lines" "$RUNNER_TEMP/run.log" > "$RUNNER_TEMP/counts.log" || true
          fi
          cat "$RUNNER_TEMP/counts.log"
          if [[ $status -ne 0 ]]; then
            if [[ "$extract" == true ]]; then
              echo "::error::migrate_queue.py exited with code $status (2 = a queue could not be built, or it was left untouched because it already has Done/Error rows - use overwrite). Run the script locally for the full log."
            else
              echo "::error::migrate_queue.py exited with code $status (2 = stopped early or a queue could not be read). Row details are in column G of the queue sheet; run the script locally for the full log."
            fi
          fi
          exit "$status"

      - name: Job summary
        if: always()
        shell: bash
        env:
          PMIS_SPREADSHEET_ID: ${{ secrets.PMIS_SPREADSHEET_ID }}
        run: |
          log="$RUNNER_TEMP/counts.log"
          [[ -f "$log" ]] || exit 0
          {
            echo "### Migration run"
            echo
            echo '```'
            # counts only (see the Migrate step); keep the spreadsheet ID out of the summary
            tail -n 40 "$log" | sed "s/${PMIS_SPREADSHEET_ID:-__none__}/***/g"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
