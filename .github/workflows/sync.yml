# Keep PMIS in sync with the legacy sheets in one run: `python pmis.py sync` = the two steps one after another, on GitHub-hosted runners.
#   1. queue   legacy sheet -> queue (MIGRATION_QUEUE / MIGRATION_QUEUE_DRQ); a new item or a changed PDF becomes a Waiting row
#   2. db      queue -> DB (DB_DWR / DB_DRQ). Part 1 (no AI): remove the DB rows that left the legacy sheet (copied to a _REMOVED_<tab> tab first), update C/P and Folder Link, set the
#              Legacy sync tag (Synced / Outdated). Part 2: the AI (Gemini) reads the PDFs of the Waiting rows, up to `limit` rows per queue
# A queue that failed or was refused in the queue step is left out of the db step; a part that fails does not stop the other one, but the run ends with an error.
# The same work is available in pieces: sync-no-ai.yml (`sync queue db --no-ai`, no AI call) and sync-db.yml (`sync db`, and `check access`).
# With mode = dry-run nothing is written and nothing is sent to Gemini: the db step shows its plan on the queue the queue step planned.
#
# Required repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   SA_KEY_JSON          the whole contents of the service-account key file (.json)
#   GEMINI_API_KEY       Gemini API key (only needed when mode = sync)
# Repository VARIABLES (the Variables tab; plain settings, not credentials). A secret with the same name still works as a fallback, and the variable wins over it:
#   PMIS_SPREADSHEET_ID         ID of the target spreadsheet (the queues are always written here)
#   PMIS_LEGACY_DWR_SHEET       exact name of the legacy tab the DWR queue is built from
#   PMIS_LEGACY_DRQ_SHEET       exact name of the legacy tab the DRQ queue is built from
#   PMIS_LEGACY_SPREADSHEET_ID  (optional) ID or URL of the spreadsheet file that holds the legacy tabs. Empty = the same file as PMIS_SPREADSHEET_ID.
#                               The run input legacy_spreadsheet wins over it. Share that file with the service account (Viewer is enough).
# Variables are not masked in the log, so the script never prints them (--public-log), and the legacy file's ID / URL is masked explicitly.
#
# Start with mode = dry-run, then run with mode = sync and a small limit.
# Safety net: a run that would remove more rows than the limit (the larger of 10% of the rows and 100) from the queue or a DB is refused; allow_large_removal lifts it.
# Not offered here (use sync-no-ai.yml / sync-db.yml): overwrite (rebuild a queue from scratch), only_rows, accept_first_report, max_output_tokens, check-access, a run without the AI.
# The log shows counts only (--public-log); the details are in column G of the queue sheet. There is no `schedule:`: GitHub's own cron was not starting runs for this repository, so call the workflow_dispatch API
# from an outside scheduler such as cron-job.org with the body {"ref":"main","inputs":{"mode":"sync","limit":"30"}}.
name: Sync all

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = show the plan of both steps, write nothing | sync = run both steps for real"
        type: choice
        options: [dry-run, sync]
        default: dry-run
      queue:
        description: "Which queue: both = DWR then DRQ"
        type: choice
        options: [both, dwr, drq]
        default: both
      limit:
        description: "Max rows per queue for the AI part of the db step (0 = no limit)"
        type: string
        default: "30"
      legacy_spreadsheet:
        description: "ID or URL of the spreadsheet that holds the legacy tabs (empty = variable PMIS_LEGACY_SPREADSHEET_ID, or the target file). Inputs are visible on the run page"
        type: string
        default: ""
      allow_large_removal:
        description: "Allow removing more rows than the safety limit (the larger of 10% of the rows and 100). Normally leave this off"
        type: boolean
        default: false

# Same group as sync-no-ai.yml and sync-db.yml: two syncs never run at the same time
concurrency:
  group: pmis-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
        with:
          extra-packages: pytest pyyaml
      - run: python -m pytest -q

  sync:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps

      - name: Sync all
        shell: bash
        env:
          # Inputs go through environment variables (never pasted into the script text)
          IN_MODE: ${{ inputs.mode || 'dry-run' }}
          IN_QUEUE: ${{ inputs.queue || 'both' }}
          IN_LIMIT: ${{ inputs.limit || '30' }}
          IN_LEGACY_SPREADSHEET: ${{ inputs.legacy_spreadsheet || '' }}
          IN_ALLOW_LARGE_REMOVAL: ${{ inputs.allow_large_removal || false }}
          SA_KEY_JSON: ${{ secrets.SA_KEY_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # variable first, then the secret of the same name (the old way) as a fallback
          PMIS_SPREADSHEET_ID: ${{ vars.PMIS_SPREADSHEET_ID || secrets.PMIS_SPREADSHEET_ID }}
          PMIS_LEGACY_DWR_SHEET: ${{ vars.PMIS_LEGACY_DWR_SHEET || secrets.PMIS_LEGACY_DWR_SHEET }}
          PMIS_LEGACY_DRQ_SHEET: ${{ vars.PMIS_LEGACY_DRQ_SHEET || secrets.PMIS_LEGACY_DRQ_SHEET }}
          PMIS_LEGACY_SPREADSHEET_ID: ${{ vars.PMIS_LEGACY_SPREADSHEET_ID || secrets.PMIS_LEGACY_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          [[ -n "$PMIS_SPREADSHEET_ID" ]] || die "Variable PMIS_SPREADSHEET_ID is missing or empty"
          # a variable is not masked by GitHub like a secret is, so mask the ID explicitly (the script never prints it anyway: --public-log)
          echo "::add-mask::$PMIS_SPREADSHEET_ID"

          args=(sync --public-log)
          case "$IN_MODE" in
            dry-run) args+=(--dry-run) ;;
            sync) [[ -n "$GEMINI_API_KEY" ]] || die "Secret GEMINI_API_KEY is missing or empty (needed for mode = sync)" ;;
            *) die "Unknown mode: $IN_MODE" ;;
          esac
          case "$IN_QUEUE" in
            both) ;;
            dwr|drq) args+=(--queue "$IN_QUEUE") ;;
            *) die "Unknown queue: $IN_QUEUE" ;;
          esac
          [[ "$IN_LIMIT" =~ ^[0-9]+$ ]] || die "limit must be a whole number"
          args+=(--limit "$IN_LIMIT")

          # The legacy tab name of each queue that is built is required
          if [[ "$IN_QUEUE" != drq && -z "$PMIS_LEGACY_DWR_SHEET" ]]; then die "Variable PMIS_LEGACY_DWR_SHEET is missing or empty (needed to build the DWR queue)"; fi
          if [[ "$IN_QUEUE" != dwr && -z "$PMIS_LEGACY_DRQ_SHEET" ]]; then die "Variable PMIS_LEGACY_DRQ_SHEET is missing or empty (needed to build the DRQ queue)"; fi
          [[ "$IN_ALLOW_LARGE_REMOVAL" != "true" ]] || args+=(--allow-large-removal)

          # The legacy file may be given as an ID or a URL; hide both forms from the log (the Running: line below prints the arguments)
          for legacy_value in "$IN_LEGACY_SPREADSHEET" "$PMIS_LEGACY_SPREADSHEET_ID"; do
            [[ -n "$legacy_value" ]] || continue
            echo "::add-mask::$legacy_value"
            legacy_id=$(printf '%s' "$legacy_value" | sed -nE 's#.*/d/([A-Za-z0-9_-]+).*#\1#p')
            if [[ -n "$legacy_id" ]]; then echo "::add-mask::$legacy_id"; fi
          done
          if [[ -n "$IN_LEGACY_SPREADSHEET" ]]; then args+=(--legacy-spreadsheet "$IN_LEGACY_SPREADSHEET"); fi

          # --public-log prints counts only. Anything the script writes to stderr (tracebacks, setup errors) goes to a file
          # that is never printed: the repository may be public, and the details can contain tab names and IDs.
          echo "Running: python pmis.py ${args[*]}"
          set +e
          bash .github/scripts/with_credentials.sh python pmis.py "${args[@]}" 2> "$RUNNER_TEMP/stderr.log" | tee >(grep -v '^::' > "$RUNNER_TEMP/counts.log")
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            echo "::error::pmis.py exited with code $status (2 = a step failed or stopped early, or a queue / DB was refused by the safety net: too many rows to remove - check the legacy sheet, then use allow_large_removal). The last line of the log shows which steps failed; the row details are in column G of the queue sheet; run the script locally for the full log."
          fi
          exit "$status"

      - name: Job summary
        if: always()
        shell: bash
        env:
          PMIS_SPREADSHEET_ID: ${{ vars.PMIS_SPREADSHEET_ID || secrets.PMIS_SPREADSHEET_ID }}
        run: bash .github/scripts/job_summary.sh "Sync run" "$RUNNER_TEMP/counts.log"
