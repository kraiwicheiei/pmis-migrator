# The db step of the sync (`python pmis.py sync db`) on GitHub-hosted runners: part 1 fixes DB_DWR / DB_DRQ to match the queue (C/P, Folder Link, tags, removals; no AI), part 2 reads the PDFs
# of the Waiting rows of MIGRATION_QUEUE / MIGRATION_QUEUE_DRQ with Gemini and writes the DB. With only_rows only part 2 runs, for those rows. Syncing the queues with the legacy sheets
# is a separate workflow: sync-no-ai.yml (`sync queue db --no-ai`); sync.yml runs the queue step and the whole db step in one go.
#
# Required repository secrets (Settings > Secrets and variables > Actions > Secrets):
#   SA_KEY_JSON          the whole contents of the service-account key file (.json)
#   GEMINI_API_KEY       Gemini API key (only needed when mode = sync)
# Required repository VARIABLE (the Variables tab; a plain setting, not a credential). A secret with the same name still works
# as a fallback, and the variable wins over it:
#   PMIS_SPREADSHEET_ID  ID of the target spreadsheet
#
# Start with mode = dry-run, then check-access (`python pmis.py check access`), then sync with a small limit.
# Safety net: a run that would remove more rows than the limit (the larger of 10% of the rows and 100) from a DB is refused (part 1 is skipped, the AI part still runs); allow_large_removal lifts it.
# The log shows counts only (--public-log); the details are in column G of the queue sheet.
name: Sync DB (with AI)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run = show the plan, write nothing | check-access = check Drive access only | sync = fix the DB rows and read the Waiting PDFs with Gemini, for real"
        type: choice
        options: [dry-run, check-access, sync]
        default: dry-run
      queue:
        description: "Which queue: both = DWR then DRQ"
        type: choice
        options: [both, dwr, drq]
        default: both
      limit:
        description: "Max rows per queue (0 = no limit)"
        type: string
        default: "30"
      only_rows:
        description: "Only these sheet rows, e.g. 83,102,127-128 (needs queue = dwr or drq). Only the AI part runs, for those rows"
        type: string
        default: ""
      accept_first_report:
        description: "If the AI returns several reports and none matches the Doc No, use the first one"
        type: boolean
        default: false
      max_output_tokens:
        description: "Gemini maxOutputTokens, e.g. 16000 (empty = not set). Use when the cell says finishReason=MAX_TOKENS"
        type: string
        default: ""
      allow_large_removal:
        description: "Allow part 1 to remove more DB rows than the safety limit (the larger of 10% of the rows and 100). Normally leave this off. Not for mode = check-access"
        type: boolean
        default: false

# No `schedule:` here: runs are started from outside (cron-job.org calls the workflow_dispatch API),
# because GitHub's own cron was not starting runs for this repository.

# Never run two syncs at the same time (a db run, a queue sync or a full sync): they would touch the same queue rows
concurrency:
  group: pmis-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
        with:
          extra-packages: pytest pyyaml
      - run: python -m pytest -q

  sync-db:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps

      - name: Sync DB (with AI)
        shell: bash
        env:
          # Inputs go through environment variables (never pasted into the script text)
          IN_MODE: ${{ inputs.mode || 'dry-run' }}
          IN_QUEUE: ${{ inputs.queue || 'both' }}
          IN_LIMIT: ${{ inputs.limit || '30' }}
          IN_ONLY_ROWS: ${{ inputs.only_rows || '' }}
          IN_ACCEPT_FIRST: ${{ inputs.accept_first_report || false }}
          IN_MAX_TOKENS: ${{ inputs.max_output_tokens || '' }}
          IN_ALLOW_LARGE_REMOVAL: ${{ inputs.allow_large_removal || false }}
          SA_KEY_JSON: ${{ secrets.SA_KEY_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # variable first, then the secret of the same name (the old way) as a fallback
          PMIS_SPREADSHEET_ID: ${{ vars.PMIS_SPREADSHEET_ID || secrets.PMIS_SPREADSHEET_ID }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          [[ -n "$PMIS_SPREADSHEET_ID" ]] || die "Variable PMIS_SPREADSHEET_ID is missing or empty"
          # a variable is not masked by GitHub like a secret is, so mask the ID explicitly (the script never prints it anyway: --public-log)
          echo "::add-mask::$PMIS_SPREADSHEET_ID"

          case "$IN_MODE" in
            dry-run) args=(sync db --public-log --dry-run) ;;
            check-access) args=(check access --public-log) ;;
            sync)
              [[ -n "$GEMINI_API_KEY" ]] || die "Secret GEMINI_API_KEY is missing or empty (needed for mode = sync)"
              args=(sync db --public-log) ;;
            *) die "Unknown mode: $IN_MODE" ;;
          esac
          case "$IN_QUEUE" in
            both) ;;
            dwr|drq) args+=(--queue "$IN_QUEUE") ;;
            *) die "Unknown queue: $IN_QUEUE" ;;
          esac
          [[ "$IN_LIMIT" =~ ^[0-9]+$ ]] || die "limit must be a whole number"
          args+=(--limit "$IN_LIMIT")
          if [[ -n "$IN_ONLY_ROWS" ]]; then
            [[ "$IN_ONLY_ROWS" =~ ^[0-9]+(-[0-9]+)?(,[0-9]+(-[0-9]+)?)*$ ]] || die "only_rows must look like 83,102,127-128"
            [[ "$IN_QUEUE" != both ]] || die "only_rows needs queue = dwr or drq (row numbers belong to one queue sheet)"
            args+=(--only-rows "$IN_ONLY_ROWS")
          fi
          if [[ -n "$IN_MAX_TOKENS" ]]; then
            [[ "$IN_MAX_TOKENS" =~ ^[0-9]+$ ]] || die "max_output_tokens must be a whole number"
            args+=(--max-output-tokens "$IN_MAX_TOKENS")
          fi
          if [[ "$IN_ACCEPT_FIRST" == "true" ]]; then
            args+=(--accept-first-report)
          fi
          if [[ "$IN_ALLOW_LARGE_REMOVAL" == "true" ]]; then
            [[ "$IN_MODE" != check-access ]] || die "allow_large_removal does not apply to mode = check-access"
            args+=(--allow-large-removal)
          fi

          # --public-log prints counts only. Anything the script writes to stderr (tracebacks, setup errors) goes to a file
          # that is never printed: the repository may be public, and the details can contain names and IDs.
          echo "Running: python pmis.py ${args[*]}"
          set +e
          bash .github/scripts/with_credentials.sh python pmis.py "${args[@]}" 2> "$RUNNER_TEMP/stderr.log" | tee >(grep -v '^::' > "$RUNNER_TEMP/counts.log")
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            echo "::error::pmis.py exited with code $status (2 = stopped early, a queue could not be read, or a queue / DB was refused by the safety net). Row details are in column G of the queue sheet; run the script locally for the full log."
          fi
          exit "$status"

      - name: Job summary
        if: always()
        shell: bash
        env:
          PMIS_SPREADSHEET_ID: ${{ vars.PMIS_SPREADSHEET_ID || secrets.PMIS_SPREADSHEET_ID }}
        run: bash .github/scripts/job_summary.sh "Sync DB run" "$RUNNER_TEMP/counts.log"
